<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">Luồng quên mật khẩu và đặt lại mật khẩu</title>
  <desc id="desc">Người dùng gửi email quên mật khẩu, server tạo reset token hash có hạn dùng, client đặt lại mật khẩu bằng passwordEncrypted.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#be123c"/></marker></defs>
  <style>
    .bg{fill:#fff7f9}.ui{fill:#fff1f2;stroke:#be123c;stroke-width:2;rx:12}.api{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:12}.db{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:12}.crypto{fill:#faf5ff;stroke:#7c3aed;stroke-width:2;rx:12}.t{font-family:Arial,sans-serif;font-size:18px;font-weight:700;fill:#111827}.s{font-family:Arial,sans-serif;font-size:13px;fill:#334155}.h{font-family:Arial,sans-serif;font-size:24px;font-weight:800;fill:#0f172a}.ar{stroke:#be123c;stroke-width:3;marker-end:url(#a);fill:none}.dash{stroke:#be123c;stroke-width:2.4;stroke-dasharray:7 7;marker-end:url(#a);fill:none}
  </style>
  <rect class="bg" width="1180" height="520"/>
  <text x="590" y="42" text-anchor="middle" class="h">Luồng quên mật khẩu: reset token hash + passwordEncrypted</text>

  <rect x="45" y="105" width="185" height="95" class="ui"/>
  <text x="137" y="138" text-anchor="middle" class="t">ForgotPassword</text>
  <text x="137" y="164" text-anchor="middle" class="s">nhập email</text>

  <rect x="285" y="105" width="205" height="95" class="api"/>
  <text x="387" y="138" text-anchor="middle" class="t">POST /forgot</text>
  <text x="387" y="164" text-anchor="middle" class="s">không lộ email tồn tại</text>

  <rect x="545" y="105" width="220" height="95" class="db"/>
  <text x="655" y="138" text-anchor="middle" class="t">User document</text>
  <text x="655" y="164" text-anchor="middle" class="s">passwordResetTokenHash</text>
  <text x="655" y="185" text-anchor="middle" class="s">expiresAt 30 phút</text>

  <rect x="820" y="105" width="230" height="95" class="ui"/>
  <text x="935" y="138" text-anchor="middle" class="t">Reset link</text>
  <text x="935" y="164" text-anchor="middle" class="s">/reset-password/:token</text>

  <rect x="820" y="285" width="230" height="95" class="crypto"/>
  <text x="935" y="318" text-anchor="middle" class="t">Mã hóa mật khẩu mới</text>
  <text x="935" y="344" text-anchor="middle" class="s">GET public key</text>
  <text x="935" y="365" text-anchor="middle" class="s">RSA-OAEP passwordEncrypted</text>

  <rect x="545" y="285" width="220" height="95" class="api"/>
  <text x="655" y="318" text-anchor="middle" class="t">POST /reset</text>
  <text x="655" y="344" text-anchor="middle" class="s">verify token hash</text>
  <text x="655" y="365" text-anchor="middle" class="s">giải mã password</text>

  <rect x="285" y="285" width="205" height="95" class="db"/>
  <text x="387" y="318" text-anchor="middle" class="t">Cập nhật mật khẩu</text>
  <text x="387" y="344" text-anchor="middle" class="s">PBKDF2 hash/salt mới</text>
  <text x="387" y="365" text-anchor="middle" class="s">xóa reset token</text>

  <rect x="45" y="285" width="185" height="95" class="ui"/>
  <text x="137" y="318" text-anchor="middle" class="t">Đăng nhập lại</text>
  <text x="137" y="344" text-anchor="middle" class="s">mật khẩu mới</text>

  <path d="M230 152H285" class="ar"/>
  <path d="M490 152H545" class="ar"/>
  <path d="M765 152H820" class="ar"/>
  <path d="M935 200V285" class="dash"/>
  <path d="M820 333H765" class="ar"/>
  <path d="M545 333H490" class="ar"/>
  <path d="M285 333H230" class="ar"/>
</svg>
