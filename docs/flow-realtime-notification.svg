<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
  <title id="title">Luồng realtime notification cho người dùng và admin</title>
  <desc id="desc">Server tạo UserNotification cho người dùng, đẩy SSE notification, đồng thời phát admin-event cho dashboard admin khi đơn hàng được tạo hoặc cập nhật.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
  </defs>
  <style>
    .bg{fill:#f8fafc}.box{fill:#fff;stroke:#9ca3af;stroke-width:2;rx:12}.api{fill:#eef5ff;stroke:#2563eb;stroke-width:2;rx:12}.store{fill:#eef8f0;stroke:#059669;stroke-width:2;rx:12}.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:12}.event{fill:#f4f0ff;stroke:#7c3aed;stroke-width:2;rx:12}.h{font-family:Arial,sans-serif;font-size:24px;font-weight:800;fill:#111827}.t{font-family:Arial,sans-serif;font-size:17px;font-weight:700;fill:#111827}.s{font-family:Arial,sans-serif;font-size:13px;fill:#4b5563}.ar{stroke:#374151;stroke-width:2.8;fill:none;marker-end:url(#a)}.purple{stroke:#7c3aed;stroke-width:2.6;fill:none;stroke-dasharray:7 7;marker-end:url(#p)}
  </style>
  <rect class="bg" width="1180" height="620"/>
  <text x="590" y="42" text-anchor="middle" class="h">Realtime notification: user stream + admin event stream</text>

  <rect x="40" y="95" width="185" height="95" class="warn"/>
  <text x="132" y="129" text-anchor="middle" class="t">Admin thao tác</text>
  <text x="132" y="155" text-anchor="middle" class="s">cập nhật order/contact</text>

  <rect x="285" y="95" width="200" height="95" class="api"/>
  <text x="385" y="129" text-anchor="middle" class="t">Admin API</text>
  <text x="385" y="155" text-anchor="middle" class="s">PATCH /admin/*/status</text>

  <rect x="545" y="95" width="220" height="95" class="store"/>
  <text x="655" y="129" text-anchor="middle" class="t">UserNotification</text>
  <text x="655" y="155" text-anchor="middle" class="s">lưu DB trước</text>
  <text x="655" y="176" text-anchor="middle" class="s">readAt=null, metadata</text>

  <rect x="825" y="95" width="250" height="95" class="event"/>
  <text x="950" y="129" text-anchor="middle" class="t">User SSE stream</text>
  <text x="950" y="155" text-anchor="middle" class="s">/notifications/stream?token</text>
  <text x="950" y="176" text-anchor="middle" class="s">event: notification</text>

  <rect x="825" y="255" width="250" height="105" class="box"/>
  <text x="950" y="291" text-anchor="middle" class="t">Client user</text>
  <text x="950" y="317" text-anchor="middle" class="s">receiveUserNotification()</text>
  <text x="950" y="338" text-anchor="middle" class="s">toast + badge chuông</text>

  <rect x="545" y="255" width="220" height="105" class="box"/>
  <text x="655" y="291" text-anchor="middle" class="t">Click notification</text>
  <text x="655" y="317" text-anchor="middle" class="s">mark read/delete</text>
  <text x="655" y="338" text-anchor="middle" class="s">đi tới link focus</text>

  <rect x="285" y="255" width="200" height="105" class="store"/>
  <text x="385" y="291" text-anchor="middle" class="t">AccountPage</text>
  <text x="385" y="317" text-anchor="middle" class="s">/account?focus=order</text>
  <text x="385" y="338" text-anchor="middle" class="s">hoặc focus=contact</text>

  <rect x="285" y="440" width="220" height="95" class="event"/>
  <text x="395" y="474" text-anchor="middle" class="t">Admin event stream</text>
  <text x="395" y="500" text-anchor="middle" class="s">/admin/events/stream</text>
  <text x="395" y="521" text-anchor="middle" class="s">event: admin-event</text>

  <rect x="565" y="440" width="220" height="95" class="warn"/>
  <text x="675" y="474" text-anchor="middle" class="t">StoreAdminPage</text>
  <text x="675" y="500" text-anchor="middle" class="s">order-created/updated</text>
  <text x="675" y="521" text-anchor="middle" class="s">reload summary/orders</text>

  <rect x="845" y="440" width="210" height="95" class="api"/>
  <text x="950" y="474" text-anchor="middle" class="t">Fallback</text>
  <text x="950" y="500" text-anchor="middle" class="s">focus tab + 60s</text>
  <text x="950" y="521" text-anchor="middle" class="s">reload notifications</text>

  <path class="ar" d="M225 142H285"/>
  <path class="ar" d="M485 142H545"/>
  <path class="ar" d="M765 142H825"/>
  <path class="ar" d="M950 190V255"/>
  <path class="ar" d="M825 308H765"/>
  <path class="ar" d="M545 308H485"/>
  <path class="purple" d="M385 360C385 405 385 420 395 440"/>
  <path class="purple" d="M385 190C330 280 315 360 395 440"/>
  <path class="purple" d="M505 488H565"/>
  <path class="purple" d="M785 488H845"/>
</svg>
