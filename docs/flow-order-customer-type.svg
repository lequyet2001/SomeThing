<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">Luồng phân loại đơn hàng theo khách đã đăng ký và khách chưa đăng ký</title>
  <desc id="desc">OrderController suy ra customerType từ order.user; admin có thể lọc registered hoặc guest trong quản lý đơn hàng.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs>
  <style>
    .bg{fill:#f8fafc}.ui{fill:#eef7ff;stroke:#2563eb;stroke-width:2;rx:12}.api{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:12}.db{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:12}.admin{fill:#faf5ff;stroke:#7c3aed;stroke-width:2;rx:12}.guest{fill:#fff1f2;stroke:#e11d48;stroke-width:2;rx:12}.t{font-family:Arial,sans-serif;font-size:18px;font-weight:700;fill:#111827}.s{font-family:Arial,sans-serif;font-size:13px;fill:#334155}.h{font-family:Arial,sans-serif;font-size:24px;font-weight:800;fill:#0f172a}.ar{stroke:#2563eb;stroke-width:3;marker-end:url(#a);fill:none}.dash{stroke:#7c3aed;stroke-width:2.4;stroke-dasharray:7 7;marker-end:url(#a);fill:none}
  </style>
  <rect class="bg" width="1180" height="560"/>
  <text x="590" y="42" text-anchor="middle" class="h">Phân loại đơn hàng: registered customer và guest customer</text>

  <rect x="45" y="105" width="190" height="95" class="ui"/>
  <text x="140" y="138" text-anchor="middle" class="t">Checkout login</text>
  <text x="140" y="164" text-anchor="middle" class="s">có JWT token</text>
  <text x="140" y="185" text-anchor="middle" class="s">user từ req.user</text>

  <rect x="45" y="310" width="190" height="95" class="guest"/>
  <text x="140" y="343" text-anchor="middle" class="t">Checkout guest</text>
  <text x="140" y="369" text-anchor="middle" class="s">không có token</text>
  <text x="140" y="390" text-anchor="middle" class="s">nhập thông tin tay</text>

  <rect x="305" y="205" width="215" height="105" class="api"/>
  <text x="412" y="239" text-anchor="middle" class="t">POST /orders</text>
  <text x="412" y="265" text-anchor="middle" class="s">lưu customer info</text>
  <text x="412" y="286" text-anchor="middle" class="s">gắn user nếu có token</text>

  <rect x="590" y="205" width="215" height="105" class="db"/>
  <text x="697" y="239" text-anchor="middle" class="t">Order document</text>
  <text x="697" y="265" text-anchor="middle" class="s">order.user != null</text>
  <text x="697" y="286" text-anchor="middle" class="s">hoặc order.user rỗng</text>

  <rect x="875" y="205" width="230" height="105" class="api"/>
  <text x="990" y="239" text-anchor="middle" class="t">serializeOrder()</text>
  <text x="990" y="265" text-anchor="middle" class="s">registered nếu có user</text>
  <text x="990" y="286" text-anchor="middle" class="s">guest nếu không có user</text>

  <rect x="590" y="400" width="215" height="95" class="admin"/>
  <text x="697" y="433" text-anchor="middle" class="t">Admin filter</text>
  <text x="697" y="459" text-anchor="middle" class="s">customerType=registered</text>
  <text x="697" y="480" text-anchor="middle" class="s">hoặc guest/all</text>

  <rect x="875" y="400" width="230" height="95" class="admin"/>
  <text x="990" y="433" text-anchor="middle" class="t">Orders table/dialog</text>
  <text x="990" y="459" text-anchor="middle" class="s">badge loại khách</text>
  <text x="990" y="480" text-anchor="middle" class="s">chi tiết đơn tương ứng</text>

  <path d="M235 152C270 170 290 205 305 235" class="ar"/>
  <path d="M235 357C270 335 290 305 305 280" class="ar"/>
  <path d="M520 257H590" class="ar"/>
  <path d="M805 257H875" class="ar"/>
  <path d="M990 310C955 365 795 390 697 400" class="dash"/>
  <path d="M805 447H875" class="dash"/>
</svg>
