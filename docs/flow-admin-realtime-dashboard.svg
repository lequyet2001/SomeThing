<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">Luồng realtime dashboard admin</title>
  <desc id="desc">StoreAdminPage mở admin event stream; khi server phát order-created hoặc order-updated, dashboard và danh sách đơn được reload theo filter hiện tại.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker></defs>
  <style>
    .bg{fill:#f8fafc}.admin{fill:#faf5ff;stroke:#7c3aed;stroke-width:2;rx:12}.api{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:12}.db{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:12}.ui{fill:#eef7ff;stroke:#2563eb;stroke-width:2;rx:12}.t{font-family:Arial,sans-serif;font-size:18px;font-weight:700;fill:#111827}.s{font-family:Arial,sans-serif;font-size:13px;fill:#334155}.h{font-family:Arial,sans-serif;font-size:24px;font-weight:800;fill:#0f172a}.ar{stroke:#7c3aed;stroke-width:3;marker-end:url(#a);fill:none}.dash{stroke:#7c3aed;stroke-width:2.4;stroke-dasharray:7 7;marker-end:url(#a);fill:none}
  </style>
  <rect class="bg" width="1180" height="520"/>
  <text x="590" y="42" text-anchor="middle" class="h">Realtime admin: order-created/order-updated làm dashboard cập nhật nhanh</text>

  <rect x="45" y="105" width="205" height="95" class="admin"/>
  <text x="147" y="138" text-anchor="middle" class="t">Admin login</text>
  <text x="147" y="164" text-anchor="middle" class="s">role admin</text>

  <rect x="305" y="105" width="220" height="95" class="admin"/>
  <text x="415" y="138" text-anchor="middle" class="t">StoreAdminPage</text>
  <text x="415" y="164" text-anchor="middle" class="s">createAdminEventStream()</text>

  <rect x="585" y="105" width="230" height="95" class="api"/>
  <text x="700" y="138" text-anchor="middle" class="t">Admin stream API</text>
  <text x="700" y="164" text-anchor="middle" class="s">GET /admin/events/stream</text>

  <rect x="875" y="105" width="230" height="95" class="db"/>
  <text x="990" y="138" text-anchor="middle" class="t">Open SSE connection</text>
  <text x="990" y="164" text-anchor="middle" class="s">verify token + admin role</text>

  <rect x="875" y="285" width="230" height="95" class="api"/>
  <text x="990" y="318" text-anchor="middle" class="t">emitAdminEvent()</text>
  <text x="990" y="344" text-anchor="middle" class="s">order-created</text>
  <text x="990" y="365" text-anchor="middle" class="s">order-updated</text>

  <rect x="585" y="285" width="230" height="95" class="admin"/>
  <text x="700" y="318" text-anchor="middle" class="t">Admin client nhận</text>
  <text x="700" y="344" text-anchor="middle" class="s">event: admin-event</text>
  <text x="700" y="365" text-anchor="middle" class="s">dedupe theo payload</text>

  <rect x="305" y="285" width="220" height="95" class="ui"/>
  <text x="415" y="318" text-anchor="middle" class="t">Reload dữ liệu</text>
  <text x="415" y="344" text-anchor="middle" class="s">summary/orders</text>
  <text x="415" y="365" text-anchor="middle" class="s">giữ route filter</text>

  <rect x="45" y="285" width="205" height="95" class="ui"/>
  <text x="147" y="318" text-anchor="middle" class="t">Dashboard UI</text>
  <text x="147" y="344" text-anchor="middle" class="s">doanh thu, đơn cần xử lý</text>
  <text x="147" y="365" text-anchor="middle" class="s">bảng/biểu đồ mới</text>

  <path d="M250 152H305" class="ar"/>
  <path d="M525 152H585" class="ar"/>
  <path d="M815 152H875" class="ar"/>
  <path d="M990 200V285" class="dash"/>
  <path d="M875 333H815" class="dash"/>
  <path d="M585 333H525" class="dash"/>
  <path d="M305 333H250" class="ar"/>
</svg>
