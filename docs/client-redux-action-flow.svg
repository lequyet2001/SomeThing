<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Ví dụ luồng thêm sản phẩm vào giỏ hàng</title>
  <desc id="desc">Người dùng bấm Add Cart, UI chạy animation bay vào cart, Redux cập nhật ngay, nếu đã đăng nhập thì đồng bộ server và không điều hướng sang trang cart.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
  <style>
    .bg{fill:#f8fafc}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:12}.api{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:12}.store{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:12}.notice{fill:#faf5ff;stroke:#7c3aed;stroke-width:2;rx:12}.text{font-family:Arial,sans-serif;font-size:18px;font-weight:700;fill:#111827}.small{font-family:Arial,sans-serif;font-size:13px;fill:#334155}.title{font-family:Arial,sans-serif;font-size:24px;font-weight:800;fill:#0f172a}.arrow{stroke:#2563eb;stroke-width:3;marker-end:url(#arrow);fill:none}.dash{stroke:#2563eb;stroke-width:2.4;stroke-dasharray:7 7;marker-end:url(#arrow);fill:none}
  </style>
  <rect class="bg" width="1120" height="560"/>
  <text x="560" y="42" text-anchor="middle" class="title">Ví dụ Redux action: Add Cart không chuyển trang</text>

  <rect x="45" y="90" width="190" height="100" class="box"/>
  <text x="140" y="127" text-anchor="middle" class="text">Product item</text>
  <text x="140" y="155" text-anchor="middle" class="small">click Add Cart</text>

  <rect x="295" y="90" width="220" height="100" class="notice"/>
  <text x="405" y="127" text-anchor="middle" class="text">Animation</text>
  <text x="405" y="155" text-anchor="middle" class="small">clone product bay vào cart</text>

  <rect x="575" y="80" width="220" height="120" class="store"/>
  <text x="685" y="116" text-anchor="middle" class="text">cartSlice</text>
  <text x="685" y="144" text-anchor="middle" class="small">dispatch addCartItem</text>
  <text x="685" y="168" text-anchor="middle" class="small">Header count cập nhật ngay</text>

  <rect x="855" y="80" width="215" height="120" class="api"/>
  <text x="962" y="116" text-anchor="middle" class="text">Cart API</text>
  <text x="962" y="144" text-anchor="middle" class="small">POST /cart/items</text>
  <text x="962" y="168" text-anchor="middle" class="small">chỉ khi đã đăng nhập</text>

  <rect x="575" y="300" width="220" height="110" class="store"/>
  <text x="685" y="337" text-anchor="middle" class="text">setCart(data.cart)</text>
  <text x="685" y="365" text-anchor="middle" class="small">đồng bộ lại từ server</text>
  <text x="685" y="389" text-anchor="middle" class="small">giữ UI hiện tại</text>

  <rect x="295" y="300" width="220" height="110" class="notice"/>
  <text x="405" y="337" text-anchor="middle" class="text">setNotice</text>
  <text x="405" y="365" text-anchor="middle" class="small">toast thêm giỏ thành công</text>
  <text x="405" y="389" text-anchor="middle" class="small">không navigate('/cart')</text>

  <rect x="45" y="300" width="190" height="110" class="box"/>
  <text x="140" y="337" text-anchor="middle" class="text">User tiếp tục</text>
  <text x="140" y="365" text-anchor="middle" class="small">ở Home/Shop/Product</text>
  <text x="140" y="389" text-anchor="middle" class="small">mở cart khi muốn</text>

  <path d="M235 140H295" class="arrow"/>
  <path d="M515 140H575" class="arrow"/>
  <path d="M795 140H855" class="dash"/>
  <path d="M962 200C940 270 830 315 795 350" class="dash"/>
  <path d="M575 355H515" class="arrow"/>
  <path d="M295 355H235" class="arrow"/>
</svg>
